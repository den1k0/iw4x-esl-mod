// =============================================================================
//  ESL-MOD -- dedicated server config
//
//  Start the server from the IW4x folder with:
//
//      iw4x.exe -dedicated +set net_port 28960 +set fs_game mods/ESL-MOD ^
//               +exec configs/ESL-MOD_server.cfg +map_rotate
//
//  "-dedicated" is a LAUNCHER SWITCH and it is the important part.  With only
//  "+set dedicated 2" the engine still starts the full client UI: it loads a map
//  and then drops straight back to the menu, so the server is never joinable and
//  the log repeats InitGame/ShutdownGame every few seconds.  With "-dedicated"
//  it comes up headless - "Server: mp_<map>", "Sending heartbeat to master", and
//  none of the client-side menu errors.
//
//  NOTE: exec resolves paths INSIDE the mod folder (fs_game), so the argument is
//  "configs/ESL-MOD_server.cfg".  "mods/ESL-MOD/configs/ESL-MOD_server.cfg" is a
//  rawfile the engine never finds: it waits a few seconds, prints "couldn't
//  exec", and the server is left with no map rotation.
//
//  Join with:   connect 127.0.0.1:28960      (same machine)
//               connect <lan-ip>:28960       (another machine on the LAN)
//               with sv_lan 0 it also registers with the IW4x server list.
//
//  The mod itself is installed by tools\install.ps1 - see docs/INSTALL.md.
// =============================================================================

// -----------------------------------------------------------------------------
//  Identity / network
// -----------------------------------------------------------------------------
// The mod appends its own version to whatever name is set here, so the server list
// reads "^2ESL-MOD^7 | S&D | 24 rounds ^7v1.0".  The number comes from version.txt
// in the repository - never type it here, or the name and the running build can
// disagree.  See "Version" in docs\CONFIG.md.
set sv_hostname            "^2ESL-MOD^7 | S&D | 24 rounds"

set net_port               28960
set sv_maxclients          18
set rcon_password          "eslmod"

// 0 = register with the server list as well (needs outbound internet),
// 1 = LAN only.  Joining by IP works either way.
set sv_lan                 0

// NOTE: "dedicated" is deliberately NOT set here.  A config is exec'd after the
// engine has already decided which mode to start in, so "set dedicated 2" in a
// file has no effect - the command line switch (-dedicated) is what selects the
// headless server.

// Server-side log, written to mods\ESL-MOD\logs\games_mp.log
set logfile                2

// -----------------------------------------------------------------------------
//  Rules, game type and match format
//
//  Everything ESL-specific (no perks, no killstreaks, no deathstreaks, the
//  attachment / equipment limits, the custom classes) and the S&D format
//  (win limit 24, round limit 24, sides switch after 12, 7.5 s defuse) come from
//  the mod's own config.  It is enforced by the mod's script as well, so the
//  values hold even if this exec is removed.
// -----------------------------------------------------------------------------
exec configs/ESL-MOD_sd.cfg

// -----------------------------------------------------------------------------
//  Saved ESL classes (they survive a restart)
//
//  A class lives in server dvars - esl_class_<id>_<type> and esl_type_<id> -
//  which is what carries it across a MAP CHANGE but not across a restart, since
//  server dvars die with the process.  This file holds the same dvars, read back
//  out of the running server by tools\class-archive.ps1 and exec'd here, so the
//  classes are back before the first level of the next run loads.
//
//  tools\server.cmd stop and restart save it (while the server is still up, which
//  is when the dvars can still be read), so a normal restart keeps the classes.
//  The file is generated - delete it to start everybody from the type defaults.
//
//  Turn the whole archive off with "set esl_keep_classes 0" (configs\ESL-MOD.cfg).
// -----------------------------------------------------------------------------
exec configs/ESL-MOD_classes.cfg

// -----------------------------------------------------------------------------
//  Map rotation
//
//  "gametype sd map <map>" - the game type is repeated for every map.  These are
//  competitive maps present in this installation (zone\*.ff); add or remove
//  entries freely, but a map that is not installed stops the rotation, so keep
//  the list to zones you actually have.
//
//  Current pool (10, checked against zone\*.ff): terminal, nightshift,
//  boneyard, highrise, subbase, afghan, invasion, checkpoint, rundown, quarry.
//
//  This list is what "Random Map" and a silent vote fall back to: when a match
//  ends the players vote on the next map (docs\MAPVOTE.md), and the winner is
//  written into this list just before the engine rotates - so the pool has to
//  hold the maps the vote can offer, and only maps that are installed.
// -----------------------------------------------------------------------------
set sv_mapRotation "gametype sd map mp_terminal gametype sd map mp_nightshift gametype sd map mp_boneyard gametype sd map mp_highrise gametype sd map mp_subbase gametype sd map mp_afghan gametype sd map mp_invasion gametype sd map mp_checkpoint gametype sd map mp_rundown gametype sd map mp_quarry"

// Emptied on every start, so a rotation edit above always begins at its first
// entry - otherwise the engine resumes wherever the previous session stopped,
// including entries that are no longer in the list.
set sv_mapRotationCurrent ""

// NOTE: 1 = the engine picks a random entry from the rotation at every
// map_rotate.  This was verified on a live server: two map_rotate commands in a
// row went mp_terminal -> mp_favela -> mp_crash_tropical with the rotation
// list itself unchanged, so the engine's own randomiser works fine.  Issues
// with "it always loads the same map" are almost always the command being
// typed without the /rcon prefix (i.e. it was never sent to the server).
set sv_randomMapRotation   1

// -----------------------------------------------------------------------------
//  Mod download for players (IW4x "sv_wwwDownload")
// -----------------------------------------------------------------------------
// The client fetches the mod list over HTTP **from this game server, on the game
// port**:  http://<server>:28960/list   (mods)  and  .../map  (usermaps).
// That means the router must forward **TCP 28960 as well as UDP 28960** - with
// only the UDP rule the client reports "Failed to download the mod list" and not
// a single request ever reaches this machine.
//
//   0 = the game server hands out the mod's own .iwd files itself (a request to
//       .../file/<name>.iwd on the same port).  One port, nothing else to run -
//       this is the recommended setting.
//   1 = the files come from sv_wwwBaseUrl over HTTP instead, which needs that
//       port open too and a web server running (tools\publish-mod.cmd -Serve).
set sv_wwwDownload 0

// Only read when sv_wwwDownload is 1:
// set sv_wwwBaseUrl  "http://91.146.92.67:8090"

// Uncomment to always start on one specific map instead of the first of the
// rotation:
// set sv_mapRotation "gametype sd map mp_nightshift"
