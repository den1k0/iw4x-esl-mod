// =============================================================================
//  ESL-MOD -- recommended Search & Destroy match settings
//
//  Starting point for a competitive 5v5 S&D game.  Tune to your league rules.
//  Exec it from your server config, e.g.
//      exec configs/ESL-MOD_sd.cfg
//
//  exec paths are relative to the mod folder (fs_game), not to the game root.
//
//  The dvar names are the native Modern Warfare 2 game type dvars; the
//  "scr_sd_" prefix is applied automatically by the base game scripts.
// =============================================================================

// --- game type ---------------------------------------------------------------
set g_gametype            sd

// --- round / match (ESL S&D format) -------------------------------------------
set scr_sd_roundlimit     24       // ESL: the match is 24 rounds long (12 per half)
set scr_sd_winlimit       13       // ESL: first to 13 round wins (24 rounds, so a
                                   // 12-12 match is a draw).  The dvar that actually
                                   // drives it is esl_sd_winlimit below - this one is
                                   // kept in step with it.
set scr_sd_timelimit      2.5      // minutes per round
set scr_sd_scorelimit     1        // rounds are won individually
set scr_sd_roundswitch    12       // ESL: switch sides after 12 rounds (halftime)

// NOTE: the stock S&D game type registers scr_sd_roundswitch with a 0..9 clamp
// (registerRoundSwitchDvar() in _utility.gsc), which would quietly turn the 12
// round half into a 9 round one.  ESL-MOD raises level.roundswitch back to 12
// one second after the level starts, and that is what makes the 12 work - see
// "ESL S&D match format" in docs/CONFIG.md.

// --- objective ---------------------------------------------------------------
set scr_sd_planttime      5        // seconds to plant
set scr_sd_defusetime     7.5      // ESL: 7.5 seconds to defuse
set scr_sd_bombtimer      45       // seconds until a planted bomb explodes
set scr_sd_multibomb      0        // single bomb site active at a time

// --- general game rules (native dvars, also used by the UI) ------------------
set scr_game_perks        0        // no perks         (ESL-MOD sets this too)
set scr_game_hardpoints   0        // no killstreaks   (ESL-MOD sets this too)
set scr_game_onlyheadshots 0
set scr_game_allowkillcam 0        // no killcams

// Spectating: 0 = off, 1 = own team only, 2 = free (every team + free camera).
// ESL-MOD enforces 1 as well (esl_spectate_team_only), so a dead player cannot
// watch the enemy - see "Spectating" in docs/CONFIG.md.
set scr_game_spectatetype 1        // dead players/spectators: own team only

// Team damage: 0 = off, 1 = on, 2 = reflect, 3 = shared.
// 1 is what competitive rulesets use - friendlies take the damage.
set scr_team_fftype       1        // friendly fire on

// The wait before the first round of every map: on PC this is the branch
// _gamelogic.gsc takes (prematchPeriod = playerwaittime, then a
// matchstarttime countdown), so this is the window players have to sort
// classes out after a map change.  The stock value is 15.
set scr_game_playerwaittime 20
set scr_game_matchstarttime 5

// scr_game_graceperiod is the *console* branch of the same code and is inert on
// PC; it is kept here only so the file matches the stock tweakable list.
set scr_game_graceperiod  15

// --- damage model ------------------------------------------------------------
set g_hardcore            0        // 0 = normal, 1 = hardcore
set scr_diehard           0        // 0 = normal, 1 = diehard (no health regen)

// --- server ------------------------------------------------------------------
set sv_maxclients         18       // must match sv_maxclients in ESL-MOD_server.cfg
set scr_tispawndelay      5

// --- ESL rules ---------------------------------------------------------------
// The mod re-applies the match format from its own script at level init, so the
// numbers above hold even when this file is not exec'd.  These are the values it
// uses; change them here if your league plays a different format.
set esl_spectate_team_only 1       // 1 = spectators see their own team only
set esl_keep_classes      1        // 1 = keep classes across a map change AND a
                                   // restart (the archive, below and in
                                   // configs/ESL-MOD_classes.cfg)
set esl_sd_rules          1        // 1 = enforce the ESL S&D match format
set esl_sd_winlimit       13       // rounds needed to win the match - the dvar that
                                   // actually drives it (esl_applySdRules() pushes it
                                   // into scr_sd_winlimit), and it matches
                                   // scr_sd_winlimit above: first to 13, 12-12 is a
                                   // draw.  Both were on 1 only while the
                                   // end-of-match map vote was being tested.
set esl_sd_roundlimit     24       // rounds in the match (0 = no round limit)
set esl_sd_roundswitch    12       // sides switch after N rounds
set esl_sd_defusetime     7.5      // seconds to defuse

// NOTE: exec paths are resolved INSIDE the mod folder (fs_game), so this is
// "configs/ESL-MOD.cfg" and not "mods/ESL-MOD/configs/ESL-MOD.cfg" - the
// longer form is a rawfile the engine never finds, and the rule dvars are then
// silently missing.
exec configs/ESL-MOD.cfg
