// =============================================================================
//  ESL-MOD -- dedicated server config
//
//  Start the server from the IW4x folder with:
//
//      iw4x.exe -dedicated +set net_port 28960 +set fs_game mods/ESL-MOD ^
//               +exec configs/ESL-MOD_server.cfg +map_rotate
//
//  "-dedicated" is a LAUNCHER SWITCH and it is the important part.  With only
//  "+set dedicated 2" the engine still starts the full client UI: it loads a map
//  and then drops straight back to the menu, so the server is never joinable and
//  the log repeats InitGame/ShutdownGame every few seconds.  With "-dedicated"
//  it comes up headless - "Server: mp_<map>", "Sending heartbeat to master", and
//  none of the client-side menu errors.
//
//  NOTE: exec resolves paths INSIDE the mod folder (fs_game), so the argument is
//  "configs/ESL-MOD_server.cfg".  "mods/ESL-MOD/configs/ESL-MOD_server.cfg" is a
//  rawfile the engine never finds: it waits a few seconds, prints "couldn't
//  exec", and the server is left with no map rotation.
//
//  Join with:   connect 127.0.0.1:28960      (same machine)
//               connect <lan-ip>:28960       (another machine on the LAN)
//               with sv_lan 0 it also registers with the IW4x server list.
//
//  The mod itself is installed by tools\install.ps1 - see docs/INSTALL.md.
// =============================================================================

// -----------------------------------------------------------------------------
//  Identity / network
// -----------------------------------------------------------------------------
set sv_hostname            "^2ESL-MOD^7 | S&D | 24 rounds | no perks / killstreaks"

set net_port               28960
set sv_maxclients          18
set rcon_password          "eslmod"

// 0 = register with the server list as well (needs outbound internet),
// 1 = LAN only.  Joining by IP works either way.
set sv_lan                 0

// NOTE: "dedicated" is deliberately NOT set here.  A config is exec'd after the
// engine has already decided which mode to start in, so "set dedicated 2" in a
// file has no effect - the command line switch (-dedicated) is what selects the
// headless server.

// Server-side log, written to mods\ESL-MOD\logs\games_mp.log
set logfile                2

// -----------------------------------------------------------------------------
//  Rules, game type and match format
//
//  Everything ESL-specific (no perks, no killstreaks, no deathstreaks, the
//  attachment / equipment limits, the custom classes) and the S&D format
//  (win limit 24, round limit 24, sides switch after 12, 7.5 s defuse) come from
//  the mod's own config.  It is enforced by the mod's script as well, so the
//  values hold even if this exec is removed.
// -----------------------------------------------------------------------------
exec configs/ESL-MOD_sd.cfg

// -----------------------------------------------------------------------------
//  Map rotation
//
//  "gametype sd map <map>" - the game type is repeated for every map.  These are
//  competitive maps present in this installation (zone\*.ff); add or remove
//  entries freely, but a map that is not installed stops the rotation, so keep
//  the list to zones you actually have.
// -----------------------------------------------------------------------------
set sv_mapRotation "gametype sd map mp_highrise gametype sd map mp_terminal gametype sd map mp_favela gametype sd map mp_estate gametype sd map mp_rust gametype sd map mp_crash_tropical gametype sd map mp_nightshift"

// -----------------------------------------------------------------------------
//  Mod download for players (IW4x "sv_wwwDownload")
//
//  IW4x can hand the mod to a client that does not have it - otherwise that
//  client fails with "Failed to download the mod list" and cannot join.  It is
//  plain HTTP from an external web server: the client asks this game server for
//  the mod list and then fetches the files from the base url below.  HTTPS is
//  refused by the client ("HTTPS not supported for downloading!") and the
//  transfer uses a TCP socket, so that port has to be reachable too.
//
//  Serve the files with:
//      tools\publish-mod.cmd -Serve
//  which stages build\webserve and prints the two lines below filled in.
//
//  The base url has to be an address players can reach, i.e. the public one -
//  which a home connection can change, so a hostname (DDNS) is nicer if you
//  have one.
// -----------------------------------------------------------------------------
set sv_wwwDownload 1
set sv_wwwBaseUrl  "http://91.146.92.67:8080"

// Uncomment to always start on one specific map instead of the first of the
// rotation:
// set sv_mapRotation "gametype sd map mp_nightshift"
