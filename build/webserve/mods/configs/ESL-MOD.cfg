// =============================================================================
//  ESL-MOD -- rule configuration
//
//  Exec this script from your server config, e.g.
//      exec mods/ESL-MOD/ESL-MOD.cfg
//
//  Every setting here is enforced by the mod's server side script
//  (maps/mp/gametypes/_esl.gsc) and cannot be overridden by a client.
//
//  Full reference with explanations: docs/CONFIG.md
// =============================================================================

// -----------------------------------------------------------------------------
//  Master switches
// -----------------------------------------------------------------------------
set esl_rules_enable     1      // 0 = fully disable ESL-MOD (vanilla rules)
set esl_notify           1      // tell players when their class was adjusted
set esl_debug            0      // 1 = active rule set + class diagnostics ([ESL] lines, heartbeat)
set esl_sanitize_interval 5     // seconds between class re-checks (0 = spawn only)

// -----------------------------------------------------------------------------
//  Core ESL rules
// -----------------------------------------------------------------------------
set esl_no_killstreaks   1      // forces scr_game_hardpoints 0
set esl_no_deathstreaks  1      // removes the deathstreak perk on spawn
set esl_no_perks         1      // forces scr_game_perks 0

// Optional extra for deathstreaks: also force self.pers["cur_death_streak"] to 0,
// once per spawn and once per death.  Keep this at 0 unless you need it - writing
// player state that early is the one thing that can destabilise the engine.
set esl_deathstreak_clamp 0

// -----------------------------------------------------------------------------
//  Customisation limits
// -----------------------------------------------------------------------------
set esl_enforce_attachments 1   // apply the attachment whitelist below
set esl_enforce_equipment   1   // apply the lethal / tactical whitelist below
set esl_enforce_weapons     1   // apply esl_weapon_denylist

// -----------------------------------------------------------------------------
//  Attachments
//
//  "no attachment" is always allowed.  Everything set to 0 is removed from the
//  player's class as soon as the server sees it.
// -----------------------------------------------------------------------------
set esl_attach_silencer  0      // ESL runs without silencers
set esl_attach_acog      0
set esl_attach_reflex    0
set esl_attach_eotech    0
set esl_attach_thermal   0
set esl_attach_grip      0
set esl_attach_gl        0      // noob tube / underbarrel grenade launcher
set esl_attach_shotgun   0
set esl_attach_heartbeat 0
set esl_attach_fmj       1      // ESL allows FMJ
set esl_attach_rof       0
set esl_attach_xmags     1      // ESL allows Extended Mags
set esl_attach_akimbo    0
set esl_attach_tactical  0

// -----------------------------------------------------------------------------
//  Lethal / equipment slot
//
//  This is the *lethal* grenade.  The editor's "4. Grenade" entry is the special
//  grenade popup (flash / smoke) and is configured below under "Tactical slot".
// -----------------------------------------------------------------------------
set esl_allow_frag_grenade       1
set esl_allow_semtex             1
set esl_allow_throwingknife      1      // offered as the second lethal choice
set esl_allow_claymore           0
set esl_allow_c4                 0
set esl_allow_blastshield        1
set esl_allow_tacticalinsertion  0

// The lethal the three ESL classes start with.  Leave it empty ("") to use the
// first allowed entry from the list above, which is the frag grenade.
set esl_default_equipment        frag_grenade_mp

// -----------------------------------------------------------------------------
//  Tactical slot
// -----------------------------------------------------------------------------
set esl_allow_flash_grenade      1
set esl_allow_smoke_grenade      1
set esl_allow_concussion_grenade 1

// -----------------------------------------------------------------------------
//  Weapon denylist
//
//  Comma separated list of BASE weapon names (no "_mp", no attachments, lower
//  case, no spaces).  Leave empty to allow everything.
//
//  Examples of names that are useful to ban in a competitive ruleset:
//      ak74u, peacekeeper, ak47classic, riotshield, onemanarmy,
//      rpg, at4, stinger, javelin, m79, throwingknife
// -----------------------------------------------------------------------------
set esl_weapon_denylist ""
